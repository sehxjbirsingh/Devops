groups:
  - name: todo-app-alerts
    rules:
      - alert: AppDown
        expr: up{job="todo-app"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Todo app is down"
          description: "Prometheus has not been able to scrape the app for more than 30 seconds."

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[1m]))
            / sum(rate(http_requests_total[1m])) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate"
          description: "More than 5% of requests are failing with a 5xx status."

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le)) > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency"
          description: "95th percentile latency is above 500ms."
